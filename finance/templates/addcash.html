{% extends "layout.html" %}

{% block main %}
    <h2 class="mb-4 text-center">Add Cash</h2>
    <form action="/addcash" method="post" class="mx-auto w-auto" style="max-width: 300px;">
        <div class="mb-3">
            <input class="form-control" name="amount" placeholder="Amount" type="number" step="0.01" min="0.01">
        </div>
        <button class="btn btn-success w-100" type="submit">Add Cash</button>
    </form>
{% endblock %}
