{% extends "layout.html" %}

{% block main %}
<div class="row justify-content-center">
    <div class="col-sm-8 col-md-5">
        <h2 class="mb-4 text-center">Buy Shares</h2>
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <form action="/buy" method="post">
                    <div class="mb-3">
                        <label class="form-label" for="symbol">Stock Symbol</label>
                        <input autocomplete="off" autofocus class="form-control text-uppercase" id="symbol"
                            name="symbol" placeholder="e.g. AAPL"
                            type="text" value="{{ request.args.get('symbol', '') }}">
                    </div>
                    <div class="mb-4">
                        <label class="form-label" for="shares">Number of Shares</label>
                        <input class="form-control" id="shares" min="1" name="shares"
                            placeholder="1" step="1" type="number">
                    </div>
                    <button class="btn btn-success w-100" type="submit">Buy</button>
                </form>
            </div>
        </div>
        <p class="text-center mt-3 text-muted small">
            Not sure what to buy? <a href="/quote">Look up a stock</a>
        </p>
    </div>
</div>
{% endblock %}
