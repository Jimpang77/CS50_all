{% extends "layout.html" %}

{% block main %}
    <h2 class="mb-4 text-center">Change Password</h2>
    <form action="/password" method="post" class="mx-auto w-auto" style="max-width: 300px;">
        <div class="mb-3">
            <input class="form-control" name="current_password" placeholder="Current Password" type="password">
        </div>
        <div class="mb-3">
            <input class="form-control" name="new_password" placeholder="New Password" type="password">
        </div>
        <div class="mb-3">
            <input class="form-control" name="confirmation" placeholder="Confirm New Password" type="password">
        </div>
        <button class="btn btn-primary w-100" type="submit">Update Password</button>
    </form>
{% endblock %}
