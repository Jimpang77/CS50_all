{% extends "layout.html" %}

{% block main %}
<div class="row justify-content-center">
    <div class="col-sm-8 col-md-5">
        <h2 class="mb-4 text-center">Stock Quote</h2>
        <div class="card shadow-sm text-center">
            <div class="card-body p-4">
                <h3 class="card-title mb-1">{{ quote.symbol }}</h3>
                <p class="text-muted mb-3">{{ quote.name }}</p>
                <div class="display-5 fw-bold text-success mb-4">{{ quote.price | usd }}</div>
                <div class="d-flex gap-2 justify-content-center">
                    <a href="/buy?symbol={{ quote.symbol }}" class="btn btn-success">Buy Shares</a>
                    <a href="/quote" class="btn btn-outline-secondary">Look Up Another</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
